spring.application.name=interview
spring.datasource.url=jdbc:h2:mem:interviewdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=interview
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:interview.sql
spring.sql.init.encoding=UTF-8

logging.level.com.fuad.interview=${APP_LOG_LEVEL:INFO}
logging.pattern.level=%5p [requestId=%X{requestId:-}]
logging.file.name=${APP_LOG_FILE:logs/interview.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
